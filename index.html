<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VisualVault - Image Gallery</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="gallery-header">
        <h1>VisualVault</h1>
        <p>Explore a curated collection featuring cities, beaches, cars, nature, animals, and architecture.</p>
        
        <!-- Filter Buttons -->
        <div class="filter-container">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="cities">Cities</button>
            <button class="filter-btn" data-filter="beaches">Beaches</button>
            <button class="filter-btn" data-filter="cars">Cars</button>
            <button class="filter-btn" data-filter="nature">Nature</button>
            <button class="filter-btn" data-filter="animals">Animals</button>
            <button class="filter-btn" data-filter="architecture">Architecture</button>
        </div>
    </header>

    <!-- Image Grid Container -->
    <main class="gallery-container">
        <div class="gallery-grid" id="galleryGrid"></div>
    </main>

    <!-- Lightbox Modal -->
    <div class="lightbox" id="lightbox">
        <span class="close-btn" id="closeBtn">&times;</span>
        <button class="nav-btn prev-btn" id="prevBtn"><i class="fas fa-chevron-left"></i></button>
        <div class="lightbox-content">
            <img src="" id="lightboxImg" alt="Enlarged view">
            <div class="lightbox-caption" id="lightboxCaption"></div>
        </div>
        <button class="nav-btn next-btn" id="nextBtn"><i class="fas fa-chevron-right"></i></button>
    </div>

    <script src="script.js"></script>
</body>
</html>
